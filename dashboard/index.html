<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tactical Timeline · MoreThanADonut</title>
  <link rel="icon" href="data:,">

  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <header class="top">
    <h1>Tactical Timeline</h1>
    <p>FC Barcelona <span>vs</span> Athletic Club</p>
    <span class="local">Local viewer</span>
  </header>
  <main>
    <section class="monitor" aria-label="Tactical video">
      <div class="stage">
        <video id="video" preload="metadata" playsinline aria-label="Tactical match footage"></video>
        <canvas id="overlay" aria-hidden="true"></canvas>
      </div>
      <div class="transport">
        <button id="previous" aria-label="Previous frame" title="Previous frame (←)">−1</button>
        <button id="play" title="Play or pause (Space)">Play</button>
        <button id="next" aria-label="Next frame" title="Next frame (→)">+1</button>
        <output id="time">00:00:00:00</output>
        <label class="frame-field">Frame <input id="frame" type="number" min="0" value="0"></label>
        <div class="overlays" aria-label="Position overlays">
          <label class="ball"><input type="checkbox" id="ball" checked> Ball</label>
          <label class="home"><input type="checkbox" id="home" checked> Barcelona</label>
          <label class="away"><input type="checkbox" id="away" checked> Athletic</label>
        </div>
      </div>
    </section>
    <section class="editor" aria-labelledby="timeline-heading">
      <div class="toolbar">
        <h2 id="timeline-heading">Timeline</h2>
        <div class="views">
          <button id="full" aria-pressed="true">Full match</button>
          <button id="public" aria-pressed="false">Public 5 min</button>
          <div class="zoom">
            <button id="out" aria-label="Zoom out" title="Zoom out">−</button>
            <button id="in" aria-label="Zoom in" title="Zoom in">+</button>
          </div>
        </div>
      </div>
      <div class="tracks">
        <div id="labels"></div>
        <div class="scroll" id="scroll">
          <div id="extent">
            <div id="timeline-window">
              <canvas id="timeline" tabindex="0" aria-label="Timeline scrubber. Use left and right arrows to step frames."></canvas>
              <div id="playhead" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="detail" class="detail">Select a time on the ruler or a track to seek.</div>
      <footer class="legend">
        <span class="home">H · Barcelona</span>
        <span class="away">A · Athletic</span>
        <span class="dead">D · Dead ball</span>
        <span class="gap">Tracking gap</span>
        <span class="outside">Outside match halves</span>
      </footer>
    </section>
    <p id="status" role="status">Loading match data…</p>
  </main>
</body>
</html>
